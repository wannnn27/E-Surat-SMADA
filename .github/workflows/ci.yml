name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Reject tracked operational data
        run: python scripts/check_no_sensitive_tracking.py

      - name: Check installed dependencies
        run: python -m pip check

      - name: Check runtime Python types
        run: |
          PYTHON_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
          SITE_PACKAGES="$(python -c 'import site; print(site.getsitepackages()[0])')"
          python -m pyrefly check --config pyrefly.toml --min-severity warn \
            --python-interpreter-path "$PYTHON_EXECUTABLE" \
            --site-package-path "$SITE_PACKAGES"

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Generate DOCX QA artifacts from synthetic data
        run: python scripts/generate_qa_letters.py

      - name: Compile Python sources
        run: python -m compileall -q app.py esurat scripts tests

      - name: Check browser JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/login.js
          node --check static/session.js
