name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Reject tracked operational data
        run: python scripts/check_no_sensitive_tracking.py

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Generate DOCX QA artifacts from synthetic data
        run: python scripts/generate_qa_letters.py

      - name: Compile Python sources
        run: python -m compileall -q app.py esurat scripts tests

      - name: Check browser JavaScript syntax
        run: node --check static/app.js
